name: windows
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # package.json has no packageManager field.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable # rust-toolchain.toml pins the real version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      # generate_context! needs frontendDist to exist at compile time.
      - run: pnpm exec vite build
      - run: cargo test --lib
        working-directory: src-tauri
      - run: pnpm tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Tokscale-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: Tokscale-windows-x64, path: out }
      # The release must exist before the tag is pushed, or re-run this job.
      - run: |
          v="${GITHUB_REF_NAME#v}"
          mv out/*.exe "out/Tokscale-${v}-windows-x64-setup.exe"
          (cd out && sha256sum *.exe > "Tokscale-${v}-windows-x64-setup.exe.sha256")
          gh release upload "$GITHUB_REF_NAME" out/* --clobber --repo "$GITHUB_REPOSITORY"
        env: { GH_TOKEN: "${{ github.token }}" }
