name: windows
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # package.json has no packageManager field.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable # rust-toolchain.toml pins the real version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      # generate_context! needs frontendDist to exist at compile time.
      - run: pnpm exec vite build
      - run: cargo test --lib
        working-directory: src-tauri
      - run: pnpm tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key has no password, but the signer still prompts without this.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - uses: actions/upload-artifact@v4
        with:
          name: Tokscale-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key has no password, but the signer still prompts without this.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - uses: actions/upload-artifact@v4
        with:
          name: Tokscale-linux-x64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig

  release:
    needs: [build, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: Tokscale-windows-x64, path: out }
      - uses: actions/download-artifact@v4
        with: { name: Tokscale-linux-x64, path: linux }
      # The release must exist before the tag is pushed, or re-run this job.
      - run: |
          v="${GITHUB_REF_NAME#v}"
          mv out/*.exe "out/Tokscale-${v}-windows-x64-setup.exe"
          mv out/*.exe.sig "out/Tokscale-${v}-windows-x64-setup.exe.sig"
          mv linux/*.AppImage "out/Tokscale-${v}-linux-x64.AppImage"
          mv linux/*.AppImage.sig "out/Tokscale-${v}-linux-x64.AppImage.sig"
          (cd out && sha256sum *.exe > "Tokscale-${v}-windows-x64-setup.exe.sha256")
          (cd out && sha256sum *.AppImage > "Tokscale-${v}-linux-x64.AppImage.sha256")
          jq -n --arg version "$v" \
            --arg win_url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Tokscale-${v}-windows-x64-setup.exe" \
            --arg linux_url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Tokscale-${v}-linux-x64.AppImage" \
            --rawfile win_sig "out/Tokscale-${v}-windows-x64-setup.exe.sig" \
            --rawfile linux_sig "out/Tokscale-${v}-linux-x64.AppImage.sig" \
            '{version:$version,platforms:{"windows-x86_64":{url:$win_url,signature:$win_sig},"linux-x86_64":{url:$linux_url,signature:$linux_sig}}}' \
            > out/latest.json
          gh release upload "$GITHUB_REF_NAME" out/* --clobber --repo "$GITHUB_REPOSITORY"
        env: { GH_TOKEN: "${{ github.token }}" }
